appId: com.colonie.app
productName: Colonie
artifactName: Colonie-${version}-${arch}.${ext}

protocols:
  - name: Colonie package install
    schemes: [ colonie ]

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from the PUBLIC releases in this source repo.
# Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: hanifstudio
    repo: colonie

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/Colonie Speech.app/**"
  # The Teach a skill recorder is gone, but a machine that once ran
  # `pnpm build:recorder` may still hold its helper build; never ship it.
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/Colonie Recorder.app/**"
  - "!**/node_modules/**"
  - package.json
  - "!electron/cua*"
  - "!electron/android-device.mjs"
  - "!electron/desktop-viewer*"
  - "!electron/desktop-workspace*"
  - "!electron/lent-screen-tools.mjs"
  - "!electron/fixtures/**"

asar: true

extraResources:
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  # The model provider catalog: models.dev data and OpenCode's refresh logic.
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
    filter:
      - "**/*"
      - "!**/local-computer*"
      - "!**/container-mcp*"
      - "!**/container-computer*"
      - "!**/local-vm-*"
      - "!**/desktop-viewer*"
      - "!**/internal-computer-control*"
      - "!**/local-vm-setup*"
      - "!**/shared-computer*"
      - "!**/computer-selection*"
      - "!**/computer-wait*"
      - "!**/turn-computer-binding*"
      - "!**/auto-vm-claims*"
  - from: skills
    to: skills

mac:
  # Two single-arch artifacts rather than one universal binary: the app is
  # architecture-specific, and universal would make users download both halves.
  # electron-updater picks by filename (arm64-marked files on Apple silicon,
  # unmarked ones on Intel), so latest-mac.yml must list all four files.
  target:
    - target: dmg
      arch: [ arm64, x64 ]
    - target: zip
      arch: [ arm64, x64 ]
  icon: build/colonie.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/Colonie Speech.app
      to: Colonie Speech.app
    - from: dist-native/browser/darwin-${arch}
      to: browser-engine
  extendInfo:
    NSMicrophoneUsageDescription: Colonie uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Colonie transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: Colonie uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Colonie uses Screen Recording so bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  # ${arch} is load-bearing: without it the x64 dmg silently overwrites
  # the arm64 one when both arches build (this section overrides both the
  # top-level and mac-level artifactName, so it must carry the arch itself)
  artifactName: Colonie-${version}-${arch}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: electron/resources/colonie-icon.png
  extraResources:
    - from: dist-native/browser/win32-x64
      to: browser-engine
  # No signing config yet (would go under win.signtoolOptions or
  # win.azureSignOptions — eb 26 nests it, there is no top-level
  # win.certificateFile). The installer is unsigned, so SmartScreen shows
  # "unknown publisher" on first run (README says so). verifyUpdateCodeSignature
  # defaults true, but electron-updater skips the check when app-update.yml
  # carries no publisherName — so auto-update still works today. Do NOT set
  # publisherName without actually signing, or every update is rejected as
  # untrusted; and once signed, keep the cert subject stable (or list both old
  # and new in publisherName) or you strand already-installed users.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Colonie
  # Versioned, like the .dmg. The README's /latest/download/ button needs a
  # STABLE filename, so ship a second copy named Colonie-setup.exe on the
  # release — the same trick as Colonie.dmg beside Colonie-${version}.dmg.
  artifactName: Colonie-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: public/colonie.svg
  category: Utility
  executableName: colonie
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: Colonie contributors
  vendor: Colonie
  syncDesktopName: true
  # The reviewed x64 CLI runtime is staged before packaging and remains
  # outside ASAR so executable modes and adjacent sidecars are preserved.
  extraResources:
    - from: dist-native/browser/linux-x64
      to: browser-engine
    - from: build/linux-colonie-browser.apparmor
      to: colonie-browser.apparmor
  desktop:
    entry:
      Name: Colonie
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional
  # Add the narrow browser policy's parser without replacing Electron's
  # default shared-library dependencies.
  fpm: [ "--depends", "apparmor" ]
  # Secure the packaged browsers and install their narrow sandbox policy.
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
