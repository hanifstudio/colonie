name: Mac early release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit to package (must have passing CI)"
        required: true
        type: string
      publish:
        description: "Publish the verified early build"
        type: boolean
        default: false
      verify_only:
        description: "Run only the real-browser journey without packaging or publishing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: friends-release
  cancel-in-progress: false

jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vite build
      - run: pnpm journey dist
  mac:
    needs: interface
    if: ${{ !inputs.verify_only }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require passing CI and refuse an existing release
        run: |
          sha=$(git rev-parse HEAD)
          verdict=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion // "missing"')
          test "$verdict" = success || { echo "::error::CI has not passed on $sha: $verdict"; exit 1; }
          version=$(node -p "require('./package.json').version")
          tag="friends-$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists; never replace published bytes"; exit 1
          fi
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: test "$(node -p process.arch)" = arm64
      - run: pnpm install --frozen-lockfile
      - name: Build the Mac Apple silicon early download
        run: pnpm colonie:dist
      - name: Verify signature and boot with disposable settings
        run: |
          codesign --verify --deep --strict release/colonie/mac-arm64/Colonie.app
          node scripts/colonie/smoke-packaged.mjs release/colonie/mac-arm64/Colonie.app
      - name: Prepare checksums and release notes
        run: |
          cd release/colonie
          test -s "Colonie-$VERSION-arm64.dmg"
          test -s "Colonie-$VERSION-arm64.zip"
          shasum -a 256 "Colonie-$VERSION-arm64.dmg" "Colonie-$VERSION-arm64.zip" > SHA256SUMS.txt
          cat > release-notes.md <<EOF
          Early build for Mac with Apple silicon. Not notarized yet: after opening it once, go to System Settings → Privacy & Security and click Open Anyway.

          - New: give your bots a computer. The first tab of the side panel is now Computer. Turn it on and every bot gets its own live screen on one shared computer, so bots can work at once and you can watch or take over any screen. It needs Docker or Podman (the first start downloads about 1.8 GB), uses about 1 GB while on, and turns itself off after 30 idle minutes. Without it, bots keep using the built-in browser. Shared workspaces do not have it yet.
          - In a group you can reply to or quote one message, and a message that did not send keeps your words and offers Try again.
          - A bot's step list shows as a card while it works. A file a bot names in its answer becomes a link that opens it.
          - You can stop or cancel one request from its line in a group. A bot that is stuck says what it tried and the exact error. Bots asked together split the work instead of repeating each other.
          - When a bot cannot answer because its account is out of quota or limited, the message now says so in the engine's own words. A group's routine stays quiet when it has nothing new.
          - Bot faces: one default face, a body picker (Upload, Body, Color) that offers only the bodies the avatar draws, a new Triangle body, and a working bot keeps the body you chose. "Generate with AI" for avatars is gone, and so is the View work button.
          - Fix: the stall watcher no longer crashes the server, and it now covers groups.

          Validation uses simulated engines only. The Computer tab was checked with a real container and a simulated engine, but never in a window, with a real Claude/Codex bot, on an Intel Mac, or on a clean Mac. Real bots following the new instructions and clean-Mac installation remain unverified.

          Built from commit $RELEASE_SHA. The Shared workspace image is ghcr.io/hanifstudio/colonie-workspace:$VERSION.
          EOF
      - name: Publish the verified early build
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [ "$PUBLISH" != true ]; then args+=(--draft); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "Colonie $VERSION (early build)" --notes-file release/colonie/release-notes.md \
            "${args[@]}" release/colonie/Colonie-"$VERSION"-arm64.dmg \
            release/colonie/Colonie-"$VERSION"-arm64.zip release/colonie/SHA256SUMS.txt
