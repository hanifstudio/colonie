name: CI

# What every change must pass: the same `pnpm check` the commit hook runs
# (typecheck, lint, structure, tests, Colonie Cloud's checks), plus the
# desktop shell's own tests. One job named CI, which branch rules require.
on:
  workflow_dispatch:
  push:
    branches: [main, restructure]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: the Shared workspace journey in a real browser
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite build
          pnpm journey dist
      - name: desktop shell tests
        run: node --test electron/environments.node-test.mjs electron/preload.node-test.mjs electron/local-workspaces.node-test.mjs electron/workspace-switch.node-test.mjs electron/colonie-config.node-test.mjs electron/data-dir-lease.node-test.mjs
