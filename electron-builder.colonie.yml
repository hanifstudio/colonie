appId: com.colonie.desktop
productName: Colonie
artifactName: Colonie-${version}-${arch}.${ext}
directories:
  buildResources: build
  output: release/colonie
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper*"
  - "!electron/resources/OpenMausBot Speech.app/**"
  - "!**/node_modules/**"
  - package.json
asar: true
extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server
    filter: ["**/*", "!server/**/*.test.*", "!server/devone/testing/**"]
  - from: dist-devone/codex-acp
    to: codex-acp
  - from: dist-devone/codex-acp/node_modules/@openai/codex
    to: codex-acp/node_modules/@openai/codex
  - from: dist-devone/codex-acp/node_modules/@openai/codex-darwin-${arch}
    to: codex-acp/node_modules/@openai/codex-darwin-${arch}
  - from: dist-devone/claude-acp
    to: claude-acp
  - from: LICENSE
    to: licenses/OpenMausBot-LICENSE.txt
  - from: NOTICE
    to: licenses/OpenMausBot-NOTICE.txt
  - from: third_party/bloub/LICENSE
    to: licenses/Bloub-LICENSE.txt
  - from: third_party/bloub/PROVENANCE.md
    to: licenses/Bloub-PROVENANCE.md
mac:
  target: dir
  icon: build/colonie.icns
  category: public.app-category.developer-tools
  identity: null
  notarize: false
